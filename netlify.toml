[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# El adaptador oficial de Netlify para Next.js (se instala solo, pero lo
# declaramos para fijar el comportamiento).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# La página principal original vive en /public/inicio.html. En Netlify los
# archivos estáticos los sirve la CDN (no Next.js), así que la portada se
# reescribe aquí; la regla de next.config.ts queda para desarrollo local.
[[redirects]]
  from = "/"
  to = "/inicio.html"
  status = 200

[[headers]]
  for = "/inicio.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Función programada que procesa confirmaciones y recordatorios cada 10 minutos.
[functions."notificaciones"]
  schedule = "*/10 * * * *"
